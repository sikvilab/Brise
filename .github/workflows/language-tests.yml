name: Brise cross-platform tests

on:
  push:
    branches: [ "main", "t", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Compile runtime as C11
        run: gcc -D_POSIX_C_SOURCE=200809L -std=c11 -Wall -Wextra -I. -c brise_runtime.c -o brise_runtime.o
      - name: Link interpreter
        run: g++ -std=c++17 -Wall -Wextra main.cpp brise_runtime.o -I. -lssl -lcrypto -ldl -lm -o brise
      - name: Build BTC
        run: gcc -std=c11 -Wall -Wextra -pedantic btc.c -o btc
      - name: Run interpreter smoke tests
        run: ./brise tests/smoke.bri
      - name: Run file I/O smoke tests
        run: |
          ./brise tests/file_io_smoke.bri
          rm -f tests/brise_io.tmp
      - name: Run matrix and managed-memory tests
        run: ./brise tests/matrix_memory_smoke.bri
      - name: Reject invalid matrix and memory access
        run: |
          if ./brise tests/matrix_bounds.bri; then
            echo "Out-of-range matrix access unexpectedly succeeded"
            exit 1
          fi
          if ./brise tests/managed_memory_limit.bri; then
            echo "Managed memory limit was not enforced"
            exit 1
          fi
          if ./brise tests/memory_after_free.bri; then
            echo "Use-after-free unexpectedly succeeded"
            exit 1
          fi
      - name: Reject file path traversal
        run: |
          for script in tests/path_traversal.bri tests/include_traversal.bri tests/call_traversal.bri; do
            if ./brise "$script"; then
              echo "$script unexpectedly succeeded"
              exit 1
            fi
          done
      - name: Test random integer boundaries
        run: |
          ./brise tests/random_bounds.bri
          if ./brise tests/random_invalid.bri; then
            echo "Out-of-range random bounds unexpectedly succeeded"
            exit 1
          fi
      - name: Run BTC transpiler smoke test
        run: |
          ./btc tests/btc_smoke.bri --no-build
          gcc -std=c11 tests/btc_smoke.c -o tests/btc_smoke
          test "$(./tests/btc_smoke)" = "13"
      - name: Run local HTTP chunked integration test
        run: |
          set -eu
          python3 tests/http_chunked_server.py > /tmp/brise-chunked-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          ./brise tests/http_chunked_smoke.bri
      - name: Run local HTTPS integration test
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tmpdir/key.pem" -out "$tmpdir/cert.pem" -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
          printf 'brise-https-ok\n' > "$tmpdir/index.html"
          (cd "$tmpdir" && openssl s_server -quiet -accept 18443 -cert cert.pem -key key.pem -WWW >server.log 2>&1) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$tmpdir"' EXIT
          for attempt in $(seq 1 20); do
            if (echo >/dev/tcp/127.0.0.1/18443) 2>/dev/null; then break; fi
            sleep 0.25
          done
          SSL_CERT_FILE="$tmpdir/cert.pem" ./brise tests/https_smoke.bri
      - name: Package Linux binaries
        run: |
          mkdir -p dist
          cp brise btc README.md LICENSE examples/math_showcase.bri examples/matrix_memory_demo.bri dist/
          printf '%s\n' "$GITHUB_SHA" > dist/BUILD_COMMIT
          tar -czf brise-linux-x86_64.tar.gz -C dist .
          sha256sum brise-linux-x86_64.tar.gz > brise-linux-x86_64.tar.gz.sha256
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: brise-linux-x86_64
          path: |
            brise-linux-x86_64.tar.gz
            brise-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH
      - name: Compile runtime as C11
        run: gcc -std=c11 -Wall -Wextra -I. -c brise_runtime.c -o brise_runtime.o
      - name: Link interpreter
        run: g++ -std=c++17 -Wall -Wextra main.cpp brise_runtime.o -I. -lwinhttp -o brise.exe -static -static-libgcc -static-libstdc++
      - name: Build BTC
        run: gcc -std=c11 -Wall -Wextra -pedantic btc.c -o btc.exe
      - name: Run interpreter smoke tests
        run: .\brise.exe tests/smoke.bri
      - name: Run file I/O smoke tests
        run: |
          .\brise.exe tests/file_io_smoke.bri
          Remove-Item -ErrorAction SilentlyContinue tests\brise_io.tmp
      - name: Run matrix and managed-memory tests
        run: .\brise.exe tests/matrix_memory_smoke.bri
      - name: Reject invalid matrix and memory access
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\brise.exe).Path
          foreach ($script in @("tests/matrix_bounds.bri", "tests/managed_memory_limit.bri", "tests/memory_after_free.bri")) {
            $result = Start-Process -FilePath $exe -ArgumentList @($script) -Wait -PassThru -NoNewWindow
            if ($result.ExitCode -eq 0) { throw "$script unexpectedly succeeded" }
          }
      - name: Reject file path traversal
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\brise.exe).Path
          foreach ($script in @("tests/path_traversal.bri", "tests/include_traversal.bri", "tests/call_traversal.bri")) {
            $result = Start-Process -FilePath $exe -ArgumentList @($script) -Wait -PassThru -NoNewWindow
            if ($result.ExitCode -eq 0) { throw "$script unexpectedly succeeded" }
          }
      - name: Test random integer boundaries
        shell: pwsh
        run: |
          .\brise.exe tests/random_bounds.bri
          $result = Start-Process -FilePath (Resolve-Path .\brise.exe).Path -ArgumentList @("tests/random_invalid.bri") -Wait -PassThru -NoNewWindow
          if ($result.ExitCode -eq 0) { throw "Out-of-range random bounds unexpectedly succeeded" }
      - name: Run BTC transpiler smoke test
        run: |
          .\btc.exe tests/btc_smoke.bri --no-build
          gcc -std=c11 tests/btc_smoke.c -o tests\btc_smoke.exe
          .\tests\btc_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "BTC generated program failed" }
      - name: Package Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item brise.exe,btc.exe,README.md,LICENSE,examples/math_showcase.bri,examples/matrix_memory_demo.bri dist/
          Set-Content -NoNewline -Path dist/BUILD_COMMIT -Value $env:GITHUB_SHA
          Compress-Archive -Path dist\* -DestinationPath brise-windows-x86_64.zip -Force
          $hash = (Get-FileHash brise-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path brise-windows-x86_64.zip.sha256 -Value "$hash  brise-windows-x86_64.zip"
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: brise-windows-x86_64
          path: |
            brise-windows-x86_64.zip
            brise-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 30
