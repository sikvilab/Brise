name: Build Brise Interpreter

on:
  push:
    branches: [ "main", "t" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # Правильный способ установки GCC на Windows через MinGW
    - name: Set up MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Compile Brise
      run: |
        g++ -std=c++17 main.cpp interpreter.cpp -I./libs -o brise.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: brise-windows-latest
        path: brise.exe
