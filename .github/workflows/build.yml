name: Build Brise Interpreter

on:
  push:
    branches: [ "main", "t" ] # Следим за основной веткой и веткой 't'
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GCC
      uses: egor-tensin/setup-gcc@v1
      with:
        version: 12 # Свежая версия компилятора

    - name: Compile Brise
      run: |
        g++ -std=c++17 main.cpp interpreter.cpp -I./libs -o brise.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: brise-windows-latest
        path: brise.exe
